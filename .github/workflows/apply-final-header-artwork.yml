name: apply-final-header-artwork

on:
  push:
    branches:
      - 'work/header-artwork-20261003'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download exact header artwork
        env:
          DESKTOP_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b8c0-81f4-8774-6c3be394b66b/raw?se=2026-10-03T07%3A07%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=ab23a2e2-ab56-52b9-b5a5-c5e91bed4ecb&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T05%3A55%3A17Z&ske=2026-10-04T05%3A55%3A17Z&sks=b&skv=2026-02-06&sig=fiOigbLNZzZCn0CnQZZvtj9F46bdEH8Yq/mgUvOMq68%3D'
          MOBILE_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-d924-820a-b964-3cad280fe382/raw?se=2026-10-03T07%3A07%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=15c2118c-d0d3-5df4-afdf-a1e039029e8d&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T04%3A24%3A13Z&ske=2026-10-04T04%3A24%3A13Z&sks=b&skv=2026-02-06&sig=B8eYnyuzS0fOPbQU3rBgUpeb8ucaOPt1a%2BIG9DxBEr8%3D'
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl -L --fail --retry 3 "$DESKTOP_URL" -o public/images/bunyodkor-header-desktop.png
          curl -L --fail --retry 3 "$MOBILE_URL" -o public/images/bunyodkor-header-mobile.png
          test "$(wc -c < public/images/bunyodkor-header-desktop.png)" -eq 120091
          test "$(wc -c < public/images/bunyodkor-header-mobile.png)" -eq 176586

      - name: Install new site header
        env:
          SITE_MENU_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$SITE_MENU_B64" | base64 -d > src/components/SiteMenu.tsx
          python - <<'PY'
          from pathlib import Path
          path = Path("src/app/page.tsx")
          text = path.read_text(encoding="utf-8")
          old = '<section className="bg-white pt-[76px] sm:pt-[82px]">'
          new = '<section className="bg-white">'
          if old not in text:
              raise SystemExit("Homepage hero spacing marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit to master
        run: |
          set -euo pipefail
          git config user.name "Sanjarbekhan automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/SiteMenu.tsx src/app/page.tsx public/images/bunyodkor-header-desktop.png public/images/bunyodkor-header-mobile.png
          git commit -m "Use final desktop and mobile header artwork"
          git push origin HEAD:master
