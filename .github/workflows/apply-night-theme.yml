name: apply-night-theme

on:
  push:
    branches:
      - 'work/night-theme-20261003'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download exact day and night hero artwork
        env:
          DESKTOP_DAY_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-6c00-8243-9c59-9ee6a20fbf6e/raw?se=2026-10-03T11%3A39%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=b9d6497b-5d1a-5606-935c-7bd1418ffe4e&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T09%3A24%3A27Z&ske=2026-10-04T09%3A24%3A27Z&sks=b&skv=2026-02-06&sig=tTvC1s1Re2PBkQqSFG5%2BYsDt7/5Cy5FYLapovHiqaOE%3D'
          DESKTOP_NIGHT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-bbb4-8210-9006-53c1dd0723dc/raw?se=2026-10-03T11%3A39%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=b90cbb16-d823-50b2-83e3-67fca97e6535&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T06%3A23%3A51Z&ske=2026-10-04T06%3A23%3A51Z&sks=b&skv=2026-02-06&sig=s7ytabRzjbwqU6wWxfg%2Bq243cshbpushqxc/0%2BTmgZI%3D'
          MOBILE_DAY_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2bcc-8210-9fa3-e6c229ae84d9/raw?se=2026-10-03T11%3A39%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=8582ac4e-fc06-501b-a091-e3b1c78291c9&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T05%3A25%3A48Z&ske=2026-10-04T05%3A25%3A48Z&sks=b&skv=2026-02-06&sig=gijnK1FlyxLwI%2BQpthhzP7SrQ9g2AQ25WzMFLUAdWVI%3D'
          MOBILE_NIGHT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-4044-8210-a4e2-f972f20629c8/raw?se=2026-10-03T11%3A39%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=1fa56573-1ee1-5e7f-8ed6-30a20e8859e6&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T09%3A24%3A28Z&ske=2026-10-04T09%3A24%3A28Z&sks=b&skv=2026-02-06&sig=2yFrbLolequSoAnW0wmOUFKBQ9WC%2B6gLDOLBMUOi4Sw%3D'
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl -L --fail --retry 3 "$DESKTOP_DAY_URL" -o public/images/bunyodkor-hero-desktop-day.png
          curl -L --fail --retry 3 "$DESKTOP_NIGHT_URL" -o public/images/bunyodkor-hero-desktop-night.png
          curl -L --fail --retry 3 "$MOBILE_DAY_URL" -o public/images/bunyodkor-hero-mobile-day.png
          curl -L --fail --retry 3 "$MOBILE_NIGHT_URL" -o public/images/bunyodkor-hero-mobile-night.png
          test "$(wc -c < public/images/bunyodkor-hero-desktop-day.png)" -eq 2993341
          test "$(wc -c < public/images/bunyodkor-hero-desktop-night.png)" -eq 3828709
          test "$(wc -c < public/images/bunyodkor-hero-mobile-day.png)" -eq 2817634
          test "$(wc -c < public/images/bunyodkor-hero-mobile-night.png)" -eq 3797827

      - name: Install automatic night theme
        env:
          THEME_CONTROLLER_B64: ''
          NIGHT_CSS_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$THEME_CONTROLLER_B64" | base64 -d > src/components/ThemeController.tsx
          printf '%s' "$NIGHT_CSS_B64" | base64 -d >> src/app/globals.css

          python - <<'PY'
          from pathlib import Path

          layout = Path("src/app/layout.tsx")
          text = layout.read_text(encoding="utf-8")
          if 'import ThemeController from "@/components/ThemeController";' not in text:
              text = text.replace('import "./globals.css";', 'import "./globals.css";\nimport ThemeController from "@/components/ThemeController";')
          text = text.replace('<html lang="uz" className={manrope.variable}>', '<html lang="uz" className={manrope.variable} suppressHydrationWarning>')
          text = text.replace('<body>{children}</body>', '<body><ThemeController />{children}</body>')
          layout.write_text(text, encoding="utf-8")

          page = Path("src/app/page.tsx")
          text = page.read_text(encoding="utf-8")
          old = '''        <picture className="block w-full">
          <source media="(min-width: 1024px)" srcSet="/images/bunyodkor-hero-desktop.png" />
          <img
            src="/images/bunyodkor-hero-mobile.png"
            alt="O‘zbekiston Bunyodkor Yoshlari Ensiklopediyasi"
            className="block h-auto w-full"
            width={1080}
            height={1920}
            loading="eager"
            fetchPriority="high"
          />
        </picture>'''
          new = '''        <div className="hero-art-day">
          <picture className="block w-full">
            <source media="(min-width: 1024px)" srcSet="/images/bunyodkor-hero-desktop-day.png" />
            <img
              src="/images/bunyodkor-hero-mobile-day.png"
              alt="O‘zbekiston Bunyodkor Yoshlari Ensiklopediyasi"
              className="block h-auto w-full"
              width={1080}
              height={1920}
              loading="eager"
              fetchPriority="high"
            />
          </picture>
        </div>
        <div className="hero-art-night">
          <picture className="block w-full">
            <source media="(min-width: 1024px)" srcSet="/images/bunyodkor-hero-desktop-night.png" />
            <img
              src="/images/bunyodkor-hero-mobile-night.png"
              alt="O‘zbekiston Bunyodkor Yoshlari Ensiklopediyasi — kechki ko‘rinish"
              className="block h-auto w-full"
              width={1080}
              height={1920}
              loading="eager"
              fetchPriority="high"
            />
          </picture>
        </div>'''
          if old not in text:
              raise SystemExit("Current homepage hero picture block was not found")
          page.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit to master
        run: |
          set -euo pipefail
          git config user.name "Sanjarbekhan automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/ThemeController.tsx src/app/layout.tsx src/app/globals.css src/app/page.tsx public/images/bunyodkor-hero-desktop-day.png public/images/bunyodkor-hero-desktop-night.png public/images/bunyodkor-hero-mobile-day.png public/images/bunyodkor-hero-mobile-night.png
          git commit -m "Add automatic day and night site theme"
          git push origin HEAD:master
