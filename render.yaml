# Render Blueprint for Bunyodkor (Next.js + existing Supabase)
# Secrets are deliberately not stored in Git.
services:
  - type: web
    name: bunyodkor-web
    runtime: node
    repo: https://github.com/sanjarbekhan/ozbekiston-bunyodkorlari
    branch: master
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /robots.txt
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.bunyodkor.com
      - key: NEXT_PUBLIC_BUNYODKOR_CONNECT_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_SANJAR_MODEL
        sync: false
